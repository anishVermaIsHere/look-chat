  backend: 
    container_name: look_chat_api
    build: 
      context: .
      dockerfile: Dockerfile
    ports: 
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - redis
    # for development
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


  redis:
    image: redis:latest
    container_name: redis_look_chat
    ports:
      - "6379:6379"