<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient for the Speech Bubble Frame -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DA4FF" />
      <stop offset="35%" stop-color="#3D5AFE" />
      <stop offset="70%" stop-color="#A832D7" />
      <stop offset="88%" stop-color="#E03072" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>

    <!-- Gradient for Neural Nodes and Network Lines -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="30%" stop-color="#3A82F6" />
      <stop offset="65%" stop-color="#9333EA" />
      <stop offset="88%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>

    <!-- Subtle Glow for Brain Network -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent Background (No rect background) -->

  <!-- Outer Speech Bubble / 'D' Frame -->
  <path d="M 120 50 
           L 260 50 
           C 380 50, 450 135, 450 250 
           C 450 365, 380 430, 260 430 
           L 210 430 
           L 135 480 
           L 135 430 
           L 120 430 
           C 50 430, 50 360, 50 290 
           L 50 120 
           C 50 50, 120 50, 120 50 Z" 
        fill="none" 
        stroke="url(#bubbleGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Brain Neural Network Centerpiece -->
  <!-- Network Connections -->
  <g stroke="url(#brainGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <!-- Top & Frontal Arc Connections -->
    <line x1="215" y1="135" x2="250" y2="130" />
    <line x1="250" y1="130" x2="285" y2="155" />
    <line x1="285" y1="155" x2="310" y2="185" />
    <line x1="310" y1="185" x2="330" y2="215" />
    <line x1="330" y1="215" x2="320" y2="255" />
    <line x1="320" y1="255" x2="295" y2="285" />
    <line x1="295" y1="285" x2="265" y2="305" />

    <!-- Occipital & Bottom Arc Connections -->
    <line x1="215" y1="135" x2="180" y2="155" />
    <line x1="180" y1="155" x2="150" y2="185" />
    <line x1="150" y1="185" x2="135" y2="220" />
    <line x1="135" y1="220" x2="150" y2="250" />
    <line x1="150" y1="250" x2="175" y2="275" />
    <line x1="175" y1="275" x2="200" y2="295" />
    <line x1="200" y1="295" x2="230" y2="305" />

    <!-- Brain Stem Extensions -->
    <line x1="230" y1="305" x2="250" y2="330" />
    <line x1="250" y1="330" x2="260" y2="360" />
    <line x1="250" y1="330" x2="235" y2="350" />

    <!-- Internal Network Webbing -->
    <line x1="215" y1="135" x2="210" y2="170" />
    <line x1="250" y1="130" x2="240" y2="175" />
    <line x1="285" y1="155" x2="270" y2="190" />
    <line x1="310" y1="185" x2="280" y2="225" />
    <line x1="330" y1="215" x2="280" y2="225" />
    <line x1="320" y1="255" x2="280" y2="225" />
    <line x1="320" y1="255" x2="285" y2="265" />
    <line x1="295" y1="285" x2="285" y2="265" />
    <line x1="265" y1="305" x2="250" y2="270" />

    <line x1="180" y1="155" x2="195" y2="185" />
    <line x1="150" y1="185" x2="175" y2="205" />
    <line x1="135" y1="220" x2="175" y2="205" />
    <line x1="135" y1="220" x2="170" y2="240" />
    <line x1="150" y1="250" x2="170" y2="240" />
    <line x1="175" y1="275" x2="205" y2="260" />
    <line x1="200" y1="295" x2="205" y2="260" />
    <line x1="230" y1="305" x2="250" y2="270" />

    <!-- Core Center Connections (Connecting to Central Hub Node) -->
    <line x1="210" y1="170" x2="235" y2="215" />
    <line x1="240" y1="175" x2="235" y2="215" />
    <line x1="270" y1="190" x2="235" y2="215" />
    <line x1="280" y1="225" x2="235" y2="215" />
    <line x1="285" y1="265" x2="235" y2="215" />
    <line x1="250" y1="270" x2="235" y2="215" />
    <line x1="205" y1="260" x2="235" y2="215" />
    <line x1="170" y1="240" x2="235" y2="215" />
    <line x1="175" y1="205" x2="235" y2="215" />
    <line x1="195" y1="185" x2="235" y2="215" />

    <!-- Extra Cross Links -->
    <line x1="210" y1="170" x2="195" y2="185" />
    <line x1="240" y1="175" x2="270" y2="190" />
    <line x1="175" y1="205" x2="195" y2="185" />
    <line x1="170" y1="240" x2="205" y2="260" />
    <line x1="250" y1="270" x2="285" y2="265" />
  </g>

  <!-- Neural Nodes (Circles with Gradient & Glow) -->
  <g fill="url(#brainGrad)" filter="url(#glow)">
    <!-- Central Prominent Node -->
    <circle cx="235" cy="215" r="14" />

    <!-- Outer Perimeter Nodes -->
    <circle cx="215" cy="135" r="9" />
    <circle cx="250" cy="130" r="10" />
    <circle cx="285" cy="155" r="8" />
    <circle cx="310" cy="185" r="8.5" />
    <circle cx="330" cy="215" r="10" />
    <circle cx="320" cy="255" r="9" />
    <circle cx="295" cy="285" r="10.5" />
    <circle cx="265" cy="305" r="7.5" />

    <circle cx="180" cy="155" r="9" />
    <circle cx="150" cy="185" r="10.5" />
    <circle cx="135" cy="220" r="9.5" />
    <circle cx="150" cy="250" r="8" />
    <circle cx="175" cy="275" r="8.5" />
    <circle cx="200" cy="295" r="9" />
    <circle cx="230" cy="305" r="9.5" />

    <!-- Brain Stem Nodes -->
    <circle cx="250" cy="330" r="6" />
    <circle cx="260" cy="360" r="7.5" />
    <circle cx="235" cy="350" r="5" />

    <!-- Inner Mesh Nodes -->
    <circle cx="210" cy="170" r="7.5" />
    <circle cx="240" cy="175" r="7" />
    <circle cx="270" cy="190" r="8.5" />
    <circle cx="280" cy="225" r="9.5" />
    <circle cx="285" cy="265" r="8" />
    <circle cx="250" cy="270" r="8.5" />
    <circle cx="205" cy="260" r="8" />
    <circle cx="170" cy="240" r="7" />
    <circle cx="175" cy="205" r="8" />
    <circle cx="195" cy="185" r="7.5" />
  </g>
</svg>
